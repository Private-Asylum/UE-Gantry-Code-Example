; Gameplay tag configuration.
;
; Experience identities live here because data assets name them. Tags only code uses are native
; (Source/Railhead/RailheadTags.h).

[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True
ClearInvalidTags=False
FastReplication=False
InvalidTagCharacters="\"',"
NumBitsForContainerSize=6
NetIndexFirstBitSegment=16

; Gantry's experience pickers filter on "Gantry.ExperienceId"; point that at this project's root.
+CategoryRemapping=(BaseCategory="Gantry.ExperienceId",RemapCategories=("Experience"))

; Experience identities: one tag per experience in the tree.
+GameplayTagList=(Tag="Experience.Base",DevComment="Root of Railhead's experience tree: the train and the line.")
+GameplayTagList=(Tag="Experience.Coast",DevComment="The Coast Line route: everything its stretches share.")
+GameplayTagList=(Tag="Experience.Coast.Harbour",DevComment="Coast Line stretch: Harbour Flats, warehouses and the sea.")
+GameplayTagList=(Tag="Experience.Coast.Cliffs",DevComment="Coast Line stretch: Cliff Road, rock wall and pines.")
+GameplayTagList=(Tag="Experience.Coast.Lighthouse",DevComment="Coast Line stretch: Lighthouse Point, at sunset.")
