; GantryCodeExample engine configuration.

[/Script/Engine.Engine]
; Gantry's asset manager: records every load as a named scope the loading screens read.
AssetManagerClassName=/Script/GantryGauge.GantryAssetManager

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Railhead.RailheadGameMode
GlobalDefaultServerGameMode=/Script/Railhead.RailheadGameMode
EditorStartupMap=/Game/Railhead/Maps/L_MainMenu.L_MainMenu
GameDefaultMap=/Game/Railhead/Maps/L_MainMenu.L_MainMenu
ServerDefaultMap=/Game/Railhead/Maps/L_Line.L_Line
bUseSplitscreen=False

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Substrate=True
r.Substrate.ProjectGBufferFormat=0
; The world scrolls past a train that stands still, and scenery instances are re-placed every few
; metres: motion blur would smear both. Off for the whole project.
r.DefaultFeature.MotionBlur=False
; Flat-painted props under a bright coastal sky read washed out at the default exposure.
r.DefaultFeature.AutoExposure.Bias=-1.0

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=DF9B3373DF9446279D82A1A48B0DE27B
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
SpatializationPlugin=
SourceDataOverridePlugin=
ReverbPlugin=
OcclusionPlugin=
SoundCueCookQualityIndex=-1
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6
bGenerateNaniteFallbackMeshes=True
