; GantryCodeExample game configuration.

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=1FA7C299FF394DE48DD046EA3B07C837
ProjectName=GantryCodeExample
CopyrightNotice=Copyright Private Asylum LLC, 2026, All Rights Reserved.
; The game's version. Gantry checks each mod's Required Game Version (in its game feature data)
; against it; LocomotiveMkII asks for 2.0 and is refused.
ProjectVersion=0.0.1.0
CompanyName=Private Asylum LLC
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "Railhead")

[/Script/Engine.AssetManagerSettings]
; Experiences are data assets, never Blueprint classes: bHasBlueprintClasses stays False, or the
; asset manager registers none of them (Gantry says so at startup).
+PrimaryAssetTypesToScan=(PrimaryAssetType="GantryExperience",AssetBaseClass="/Script/GantryExperience.GantryExperienceDefinition",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Railhead/Experiences")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
; Game feature data: the rule the GameFeatures editor module asks for (it reports a load error
; without one) and adds itself. It gives every game feature plugin's GameFeatureData asset (each
; mod's) its primary asset type and the Always Cook rule. The game features subsystem loads each
; plugin's data from the plugin itself, so the asset manager has nothing to scan for: /Game/Unused
; is a folder that does not exist, so the rule never scans the project's own content.
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))

[/Script/GantryGauge.GantryGaugeSettings]
; The ledger the tunnels and the loading screen read.
bEnableLoadLedger=True
; Each asset by name, so the loading screen's feed can list what it loaded.
bTrackIndividualAssets=True
; Which assets have loaded is checked ten times a second; counts update every frame regardless.
LoadDetailPollInterval=0.100000
; Closed scopes kept as recent history, for the Load Gauge panel.
CompletedScopeHistorySize=64
; Every blocking load after startup is a hitch; log each one.
bWarnOnBlockingLoads=True

[/Script/GantryExperience.GantryExperienceSettings]
; The root of the experience tree. Everything activatable is reachable from it.
BaseExperience=/Game/Railhead/Experiences/EXP_Base.EXP_Base
; A stage still running after 15 seconds is logged as possibly stuck.
ExperienceStageStallWarningTime=15.000000
; The line starts on the Coast Line's first stretch. ?Experience=Experience.Coast.Cliffs on the URL
; (or -Experience= on the command line) starts somewhere else.
; The main menu runs Lighthouse Point behind itself, at sunset.
MapExperiences=(("/Game/Railhead/Maps/L_Line.L_Line", (TagName="Experience.Coast.Harbour")),("/Game/Railhead/Maps/L_MainMenu.L_MainMenu", (TagName="Experience.Coast.Lighthouse")))
; Railhead takes mods: every folder under Mods/ (in the project directory) holding one
; game feature plugin, or a .gantry file, mounted at startup. Nothing in the game names one; each
; finds its place by experience tags (Attach To, Extends). The editor mounts them on request:
; Gantry.Mods.Mount.
+ModDirectories=(Path="Mods")
bMountModsAtStartup=True
; Look at Mods/ every 2 seconds while the train runs: a mod dropped in joins at the next tunnel.
ModRescanInterval=2.0
; The line and the train take components from game features (an Add Components action). Gantry
; registers every one spawned as a receiver, so neither class registers itself. The example mods
; use the game's stages instead.
+AutomaticReceiverClasses=/Script/Railhead.RailheadLine
+AutomaticReceiverClasses=/Script/Railhead.RailheadTrain

[/Script/GantryCore.GantryCoreSettings]
; Railhead's API: the channels its module declares, the classes marked GantryAPI in its source.
; Generated into Config/DefaultGantryAPI.ini; a mod built against 1.x keeps working on 1.y.
APIVersion=1.0
; A message or hook on a channel nobody declared (or with the wrong payload) is a bug in the game
; or a mod; say so.
bWarnOnUndeclaredChannels=True

[/Script/Railhead.RailheadLiverySettings]
; The train's paint. A mod repaints it from its own Config/<Mod>Game.ini, in this section.
Caboose=(R=0.450000,G=0.050000,B=0.030000,A=1.000000)

[/Script/GantrySettings.GantrySettingsConfig]
; Railhead declares its Video and Crew pages in code, for each player. The Coast Line adds its own
; page while it runs (an Add Settings Pages stage on EXP_Coast), so nothing here names a route.
+Providers=/Script/Railhead.RailheadSettingsProvider
; The Mods page: a toggle for each mod found, built again whenever the mods change.
+Providers=/Script/Railhead.RailheadModsProvider
; Players' values are saved in this slot, with each player's user index appended.
SaveSlotName=RailheadSettings
; A new window mode or resolution reverts by itself unless kept within 15 seconds.
VideoConfirmSeconds=15.0

[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/Railhead/Maps")

[/Script/GameFeatures.GameFeaturesSubsystemSettings]
; Gantry's policy subclass: refuses a plugin built for another engine or game version before it mounts.
GameFeaturesManagerClassName=/Script/GantryExperience.GantryGameFeaturesProjectPolicies
