; The whole mod: one key in the game's livery section. A game feature's config changes live in
; Config/<Mod><Branch>.ini (LiveryCobaltGame.ini, for the Game branch): when the mod's game feature
; activates (its experience lists it), the engine layers this over the game's own config and the
; caboose turns cobalt blue at the next stretch. No other ini file in Config/ is applied (Config/Tags
; is read separately, when the mod registers). Another mod setting the same key: whichever
; activates last wins, and Gantry reports the clash.
[/Script/Railhead.RailheadLiverySettings]
