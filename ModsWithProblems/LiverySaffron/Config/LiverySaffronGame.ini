; The whole mod: one key in the game's livery section. A game feature's config changes live in
; Config/<Mod><Branch>.ini (LiverySaffronGame.ini, for the Game branch): when the mod's game feature
; activates (its experience lists it), the engine layers this over the game's own config and the
; caboose turns saffron at the next stretch. Any other name here is never applied. Another mod
; setting the same key: whichever activates last wins, and Gantry reports the clash.
[/Script/Railhead.RailheadLiverySettings]
Caboose=(R=0.900000,G=0.520000,B=0.040000,A=1.000000)
